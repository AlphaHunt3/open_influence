[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "influence-client"
version = "0.1.0"
description = "Give AI agents influence intelligence across X, Binance Square and YouTube. MCP server, Python client and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "XHunt Developer", email = "dev@xhunt.ai"}]
keywords = ["mcp", "ai-agent", "influence", "kol", "twitter", "binance-square", "youtube", "web3"]
dependencies = ["mcp>=1.25,<2", "httpx>=0.27,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
influence-client = "influence_client.cli:main"

[project.urls]
Homepage = "https://mcp.xhunt.ai"
Documentation = "https://github.com/AlphaHunt3/open_influence/blob/main/docs/tools.md"
Repository = "https://github.com/AlphaHunt3/open_influence"
Issues = "https://github.com/AlphaHunt3/open_influence/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/influence_client"]
