name: Package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python -m compileall -q src examples
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run influence-client --help
      - run: uv run python scripts/verify_docs.py
      - run: uv build
      - run: uv venv dist/installed-venv --python ${{ matrix.python-version }}
      - if: matrix.distribution == 'wheel'
        run: uv pip install --python dist/installed-venv/bin/python dist/*.whl
      - if: matrix.distribution == 'sdist'
        run: uv pip install --python dist/installed-venv/bin/python dist/*.tar.gz
      - run: dist/installed-venv/bin/python scripts/verify_installed_client.py --offline
